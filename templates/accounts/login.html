{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div class="form">
  <h1>Entrar</h1>
  <p class="sub" style="margin-bottom:20px">Acompanhe para onde o seu dinheiro está indo.</p>

  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "includes/_campos.html" %}
    <div class="acoes-form">
      <button type="submit" class="btn btn-principal">Entrar</button>
    </div>
  </form>

  <p class="ajuda" style="margin-top:20px">
    Ainda não tem conta? <a href="{% url 'accounts:register' %}">Criar uma agora</a>
  </p>
</div>
{% endblock %}
